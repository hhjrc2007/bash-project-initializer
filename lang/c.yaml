dirs:
  - src

files:
  src/main.c: |
    #include <stdio.h>

    int main(void) {
        printf("Hello, world!\n");
        return 0;
    }
  Makefile: |
    CC = cc
    CFLAGS = -Wall -Wextra

    main: src/main.c
    	$(CC) $(CFLAGS) -o main src/main.c

    clean:
    	rm -f main
  .gitignore: |
    *.o
    main
